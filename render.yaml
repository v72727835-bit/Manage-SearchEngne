services:
  # 1) Lead finder + GitHub tools (Python, small)
  - type: web
    name: freelance-lead-finder-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: MCP_PATH
        sync: false        # secret path, e.g. /mcp-x7k2p9q4
      - key: MY_PROFILE
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false

  # 2) Cloud browser agent (Chromium). Needs ~1 GB RAM -> "starter" plan.
  - type: web
    name: browser-agent-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile.browser
    plan: starter
    healthCheckPath: /
    envVars:
      - key: MCP_PATH
        sync: false        # a DIFFERENT secret path
    disk:
      name: browser-data
      mountPath: /data     # keeps logins (cookies) across restarts
      sizeGB: 1
